name: Build Vayu Kernel (Performance)
on:
  workflow_dispatch:
    inputs:
      config:
        description: 'Kernel config'
        required: true
        default: 'vayu_user_defconfig'
        type: choice
        options:
          - vayu_user_defconfig
          - vayu_defconfig

jobs:
  build:
    name: Build Kernel
    runs-on: ubuntu-latest
    container:
      image: ubuntu:20.04

    steps:

        make O=out clean
        make O=out mrproper

        make O=out ${{ inputs.config }}

        ./scripts/config --file out/.config --enable LTO_CLANG
        ./scripts/config --file out/.config --enable THINLTO
        ./scripts/config --file out/.config --disable DEBUG_INFO

        make -j$(nproc --all) O=out \
          CC="ccache clang" \
          CXX="ccache clang++" \
          AR=llvm-ar \
          NM=llvm-nm \
          OBJCOPY=llvm-objcopy \
          OBJDUMP=llvm-objdump \
          STRIP=llvm-strip \
          KCFLAGS="$KCFLAGS" \
          LLVM=1 LLVM_IAS=1 \
          CROSS_COMPILE=aarch64-linux-gnu- \
          CROSS_COMPILE_ARM32=arm-linux-gnueabi-

    - name: ccache stats
      if: always()
      run: |
        ccache -s
