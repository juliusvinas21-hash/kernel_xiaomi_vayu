- name: Install Build Dependencies
      run: |
        export DEBIAN_FRONTEND=noninteractive
        apt-get update && apt-get install -y \
          build-essential bc curl gnupg gperf imagemagick lib32readline-dev \
          lib32z1-dev liblz4-tool libncurses5-dev libsdl1.2-dev libssl-dev \
          libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools \
          xsltproc zip zlib1g-dev python2 python3 libtinfo5 python-is-python3 \
          ccache bison flex libelf-dev

    # ... (Keep your Setup KernelSU, Proton Clang, AnyKernel, and Enable ccache steps the same) ...

    - name: Build Kernel
      run: |
        export PATH=$GITHUB_WORKSPACE/clang/bin:$PATH
        export ARCH=arm64
        export SUBARCH=arm64
        export CROSS_COMPILE=aarch64-linux-gnu-
        export CROSS_COMPILE_ARM32=arm-linux-gnueabi-

        # Optimization flags
        export KCFLAGS="-O3 -fmerge-all-constants -fstrict-aliasing \
        -ffast-math -fno-semantic-interposition -funsafe-math-optimizations"

        export LLVM=1
        export LLVM_IAS=1

        # Clean source (removed O=out)
        make clean
        make mrproper

        # Make config (removed O=out)
        make ${{ inputs.config }}

        # Modify config (removed out/ prefix)
        ./scripts/config --file .config --enable LTO_CLANG
        ./scripts/config --file .config --enable THINLTO
        ./scripts/config --file .config --disable DEBUG_INFO

        # Build (removed O=out)
        # We quote ccache clang safely here
        make -j$(nproc --all) \
          CC="ccache clang" \
          CXX="ccache clang++" \
          AR=llvm-ar \
          NM=llvm-nm \
          OBJCOPY=llvm-objcopy \
          OBJDUMP=llvm-objdump \
          STRIP=llvm-strip \
          KCFLAGS="$KCFLAGS" \
          LLVM=1 LLVM_IAS=1 \
          CROSS_COMPILE=aarch64-linux-gnu- \
          CROSS_COMPILE_ARM32=arm-linux-gnueabi-

    - name: Package Kernel
      if: success()
      run: |
        # Updated paths (removed out/ prefix)
        if [ -f arch/arm64/boot/Image ]; then
           cp arch/arm64/boot/Image AnyKernel3/
        elif [ -f arch/arm64/boot/Image.gz ]; then
           cp arch/arm64/boot/Image.gz AnyKernel3/
        fi

        [ -f arch/arm64/boot/dtbo.img ] && cp arch/arm64/boot/dtbo.img AnyKernel3/

        cd AnyKernel3
        zip -r9 ../Vayu-Kernel-Signed.zip * -x .git README.md
