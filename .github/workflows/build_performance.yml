name: Build Vayu Kernel (Performance)
on:
  workflow_dispatch:
    inputs:
      config:
        description: 'Kernel config'
        required: true
        default: 'vayu_user_defconfig'
        type: choice
        options:
          - vayu_user_defconfig
          - vayu_defconfig

jobs:
  build:
    name: Build Kernel
    runs-on: ubuntu-latest

    container:
      image: ubuntu:20.04

    steps:
    - name: Install Git for Checkout Support
      run: |
        apt-get update
        apt-get install -y git

    - name: Checkout Kernel Source
      uses: actions/checkout@v4
      with:
        submodules: recursive
        fetch-depth: 1

    - name: Install Build Dependencies
      run: |
        apt-get update && apt-get install -y \
          build-essential bc curl git gnupg gperf imagemagick lib32readline-dev \
          lib32z1-dev liblz4-tool libncurses5-dev libsdl1.2-dev libssl-dev \
          libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools \
          xsltproc zip zlib1g-dev python2 python3 libtinfo5 python-is-python3 \
          ccache
