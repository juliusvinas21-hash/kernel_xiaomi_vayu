name: Build Kernel (vayu 4.14 - KernelSU-Next)

on:
  workflow_dispatch:
  push:
    branches:
      - HEAD

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: true

      - name: Install dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            bc bison flex make \
            libssl-dev build-essential \
            zip unzip curl git \
            gcc-aarch64-linux-gnu \
            gcc-arm-linux-gnueabi

      - name: Download Google Clang r547379
        run: |
          mkdir -p clang
          curl -L https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/main/clang-r547379.tar.gz \
            | tar -xz -C clang

      - name: Setup KernelSU-Next
        run: |
          curl -LSs https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh | bash -

      # -------------------------------
      # Kernel configuration (FULL LLVM)
      # -------------------------------
      - name: Kernel configuration
        run: |
          export PATH=$PWD/clang/bin:$PATH
          make ARCH=arm64 O=out LLVM=1 vayu_user_defconfig

      # -------------------------------
      # Kernel build (FULL LLVM)
      # -------------------------------
      - name: Build kernel
        run: |
          export PATH=$PWD/clang/bin:$PATH
          make ARCH=arm64 O=out LLVM=1 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            -j$(nproc)

      # -------------------------------
      # Package AnyKernel3
      # -------------------------------
      - name: Package AnyKernel3
        run: |
          git clone --depth=1 https://github.com/Vynxid/AnyKernel3 AnyKernel
          cp out/arch/arm64/boot/Image AnyKernel/
          cp out/arch/arm64/boot/dtbo.img AnyKernel/ || true
          cd AnyKernel
          zip -r9 ../vayu-kernel-ksunext.zip .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: vayu-kernel-ksunext
          path: vayu-kernel-ksunext.zip
