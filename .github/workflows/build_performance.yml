    - name: Install Build Dependencies
      run: |
        apt-get update && apt-get install -y \
          build-essential bc curl git gnupg gperf imagemagick lib32readline-dev \
          lib32z1-dev liblz4-tool libncurses5-dev libsdl1.2-dev libssl-dev \
          libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools \
          xsltproc zip zlib1g-dev python2 python3 libtinfo5 python-is-python3 \
          ccache

    - name: Enable ccache
      run: |
        ccache --max-size=5G
        ccache -z

    - name: Build Kernel
      run: |
        export PATH=$GITHUB_WORKSPACE/clang/bin:$PATH
        export ARCH=arm64
        export SUBARCH=arm64
        export CROSS_COMPILE=aarch64-linux-gnu-
        export CROSS_COMPILE_ARM32=arm-linux-gnueabi-

        export CC="ccache clang"
        export CXX="ccache clang++"
        export AR=llvm-ar
        export NM=llvm-nm
        export OBJCOPY=llvm-objcopy
        export OBJDUMP=llvm-objdump
        export STRIP=llvm-strip

        # Kernel-safe optimization flags
        export KCFLAGS="-O3 -fmerge-all-constants -fstrict-aliasing \
        -ffast-math -fno-semantic-interposition -funsafe-math-optimizations"

        export LLVM=1
        export LLVM_IAS=1

        make O=out clean
        make O=out mrproper

        make O=out ${{ inputs.config }}

        ./scripts/config --file out/.config --enable LTO_CLANG
        ./scripts/config --file out/.config --enable THINLTO
        ./scripts/config --file out/.config --disable DEBUG_INFO

        make -j$(nproc --all) O=out \
          CC="ccache clang" \
          CXX="ccache clang++" \
          AR=llvm-ar \
          NM=llvm-nm \
          OBJCOPY=llvm-objcopy \
          OBJDUMP=llvm-objdump \
          STRIP=llvm-strip \
          KCFLAGS="$KCFLAGS" \
          LLVM=1 LLVM_IAS=1 \
          CROSS_COMPILE=aarch64-linux-gnu- \
          CROSS_COMPILE_ARM32=arm-linux-gnueabi-

    - name: ccache stats
      if: always()
      run: |
        ccache -s
