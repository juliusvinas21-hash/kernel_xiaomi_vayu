name: Build Vayu Kernel (Fixed & Performance)
on:
  workflow_dispatch:
    inputs:
      config:
        description: 'Config to use'
        required: true
        default: 'vayu_user_defconfig'
        type: choice
        options:
          - vayu_user_defconfig
          - vayu_defconfig

jobs:
  build:
    name: Build Kernel
    runs-on: ubuntu-latest
    # --- THE FIX IS HERE: We force Ubuntu 20.04 ---
    container:
      image: ubuntu:20.04

    steps:
    - name: Checkout Kernel Source
      uses: actions/checkout@v4
      with:
        submodules: recursive
        fetch-depth: 1

    - name: Install Build Dependencies
      run: |
        apt-get update && apt-get install -y \
          build-essential bc curl git gnupg gperf imagemagick lib32readline-dev \
          lib32z1-dev liblz4-tool libncurses5-dev libsdl1.2-dev libssl-dev \
          libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools \
          xsltproc zip zlib1g-dev python2 python3 libtinfo5 \
          python-is-python3

    - name: Setup KernelSU-Next (Latest)
      run: |
        rm -rf KernelSU-Next kernelsu drivers/kernelsu
        curl -LSs "https://raw.githubusercontent.com/rifsxd/KernelSU-Next/next/kernel/setup.sh" | bash -s next
        echo "CONFIG_KSU=y" >> arch/arm64/configs/${{ inputs.config }}
        echo "CONFIG_OVERLAY_FS=y" >> arch/arm64/configs/${{ inputs.config }}

    - name: Get Proton Clang
      run: |
        git clone --depth=1 https://github.com/kdrag0n/proton-clang clang

    - name: Get AnyKernel3
      run: |
        git clone https://github.com/osm0sis/AnyKernel3
        rm -rf AnyKernel3/.git

    - name: Build Kernel
      run: |
        export PATH=$GITHUB_WORKSPACE/clang/bin:$PATH
        export ARCH=arm64
        export SUBARCH=arm64
        export CROSS_COMPILE=aarch64-linux-gnu-
        export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
        export CC=clang
        export CXX=clang++
        export AR=llvm-ar
        export NM=llvm-nm
        export OBJCOPY=llvm-objcopy
        export OBJDUMP=llvm-objdump
        export STRIP=llvm-strip

        # Clean
        make O=out clean
        make O=out mrproper

        # Configure
        make O=out ${{ inputs.config }}

        # Optimization Flags
        ./scripts/config --file out/.config --enable LTO_CLANG
        ./scripts/config --file out/.config --enable THINLTO
        ./scripts/config --file out/.config --disable DEBUG_INFO

        # Build
        make -j$(nproc --all) O=out \
          CC=clang \
          AR=llvm-ar \
          NM=llvm-nm \
          OBJCOPY=llvm-objcopy \
          OBJDUMP=llvm-objdump \
          STRIP=llvm-strip \
          CROSS_COMPILE=aarch64-linux-gnu- \
          CROSS_COMPILE_ARM32=arm-linux-gnueabi-

    - name: Package Kernel
      if: success()
      run: |
        if [ -f out/arch/arm64/boot/Image ]; then
           cp out/arch/arm64/boot/Image AnyKernel3/
        elif [ -f out/arch/arm64/boot/Image.gz ]; then
           cp out/arch/arm64/boot/Image.gz AnyKernel3/
        fi
        [ -f out/arch/arm64/boot/dtbo.img ] && cp out/arch/arm64/boot/dtbo.img AnyKernel3/
        
        cd AnyKernel3
        zip -r9 ../Vayu-Kernel-Signed.zip * -x .git README.md

    - name: Upload Kernel Zip
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: Vayu-Kernel-Signed
        path: Vayu-Kernel-Signed.zip
